name: index
# Every 15 min (crons can be delayed or dropped — push to a watched path to force a run).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_post:
        description: "Test post: re-post the latest payout to Telegram"
        type: boolean
        default: false
  push:
    paths:
      - scripts/index-rewards.mjs
      - scripts/panel-probe.mjs
      - scripts/feed-probe.mjs
      - scripts/announce.mjs
      - scripts/config.mjs
      - scripts/lib.mjs
      - .github/workflows/index.yml
      - data/.index-trigger
permissions:
  contents: write
  actions: write # lets the fallback below start the next run
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      # Always start from the latest committed state, even when this run was queued.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Panel
        continue-on-error: true
        run: node scripts/panel-probe.mjs
      - name: Activity feed (per-day totals)
        continue-on-error: true
        run: node scripts/feed-probe.mjs
      # Posts new payouts to Telegram and a daily recap to X. Each channel is
      # skipped until its secrets exist; the first run only records state.
      - name: Announce payouts
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          TEST_POST: ${{ inputs.test_post }}
        run: |
          if [ -n "$X_API_KEY" ]; then npm i --prefix .bot --no-save --no-package-lock twitter-api-v2@1 >/dev/null 2>&1; fi
          node scripts/announce.mjs
      - name: Chain
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          TIME_BUDGET_MS: "3000000"
        run: node scripts/index-rewards.mjs
      - name: Reconcile
        if: always()
        run: |
          node -e '
            const fs=require("fs");
            const p=JSON.parse(fs.readFileSync("data/panel.json","utf8"));
            const r=JSON.parse(fs.readFileSync("data/rewards.json","utf8"));
            const row=(k,a,b)=>console.log(k.padEnd(16), String(a).padEnd(14), String(b).padEnd(14), a&&b?((b/a-1)*100).toFixed(3)+"%":"");
            console.log("\n===== RECONCILE (panel vs chain) =====");
            row("fees", p.feesCollected, r.feesCollected);
            row("paidToHolders", p.paidToHolders, r.paidToHolders);
            row("rounds", p.roundsPaid, r.rounds);
            row("walletPayments", p.walletPayments, r.walletPayments);
            console.log("synced", r.synced, "cursor", r.cursor, "head", r.head, "holders", r.holders, "aboveMin", r.holdersAboveMin, "holderShare", r.holderShare);
            console.log("otherOut", r.otherOut, JSON.stringify(r.otherOutByRecipient));
          '
      - name: Commit
        if: always()
        run: |
          git config user.name "wei-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet && exit 0
          git commit -m "data: index snapshot [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
      # Scheduled crons can be delayed for hours or dropped. If none has run in
      # the last 30 min, start the next run ourselves after a short pause.
      # (workflow_dispatch is the one event GITHUB_TOKEN may trigger.) Once the
      # cron is firing, this stays dormant.
      - name: Keep the chain alive
        if: always() && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" -w index.yml -e schedule -L 1 --json createdAt -q '.[0].createdAt' || true)
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 1800 ]; then
            echo "cron is alive (last scheduled run $last) — not chaining"; exit 0
          fi
          echo "no scheduled run in 30 min (last: ${last:-never}) — next run in 5 min"
          sleep 300
          gh workflow run index.yml -R "$GITHUB_REPOSITORY" --ref main
