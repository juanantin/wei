name: index
# Every 15 min (crons can be delayed or dropped — push to a watched path to force a run).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/index-rewards.mjs
      - scripts/panel-probe.mjs
      - scripts/config.mjs
      - scripts/lib.mjs
      - .github/workflows/index.yml
      - data/.index-trigger
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Panel
        continue-on-error: true
        run: node scripts/panel-probe.mjs
      - name: Chain
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
        run: node scripts/index-rewards.mjs
      - name: Reconcile
        if: always()
        run: |
          node -e '
            const fs=require("fs");
            const p=JSON.parse(fs.readFileSync("data/panel.json","utf8"));
            const r=JSON.parse(fs.readFileSync("data/rewards.json","utf8"));
            const row=(k,a,b)=>console.log(k.padEnd(16), String(a).padEnd(14), String(b).padEnd(14), a&&b?((b/a-1)*100).toFixed(3)+"%":"");
            console.log("\n===== RECONCILE (panel vs chain) =====");
            row("fees", p.feesCollected, r.feesCollected);
            row("paidToHolders", p.paidToHolders, r.paidToHolders);
            row("rounds", p.roundsPaid, r.rounds);
            row("walletPayments", p.walletPayments, r.walletPayments);
            console.log("synced", r.synced, "holders", r.holders, "aboveMin", r.holdersAboveMin, "outOverIn", r.outOverIn);
          '
      - name: Commit
        if: always()
        run: |
          git config user.name "wei-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet && exit 0
          git commit -m "data: index snapshot [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
