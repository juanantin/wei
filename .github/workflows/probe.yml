name: probe
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/panel-probe.mjs
      - scripts/find-launch.mjs
      - scripts/config.mjs
      - .github/workflows/probe.yml
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Launch blocks
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
        run: node scripts/find-launch.mjs | tee data/launch.txt
      - name: Panel
        run: node scripts/panel-probe.mjs
      - name: Commit
        if: always()
        run: |
          git config user.name "wei-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet && exit 0
          git commit -m "data: probe snapshot"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
